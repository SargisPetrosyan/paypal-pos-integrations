# This workflow installs Python dependencies and runs the test suite.

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: webhook_validator/pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install the project
        working-directory: webhook_validator
        run: uv sync --locked --all-extras --dev

      - name: Format Code
        working-directory: webhook_validator
        run: uv run ruff format --check

      - name: Run tests
        working-directory: webhook_validator
        run: uv run pytest
