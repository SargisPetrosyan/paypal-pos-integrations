[project]
name = "webhook-validator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.14.3",
    "pytest>=9.2.0",
    "dotenv>=0.9.9",
    "aurora-dsql-python-connector>=0.2.7",
    "psycopg2-binary>=2.9.13",
    "ruff>=0.17.6",
]

[dependency-groups]
dev = [
    "pydantic[email]>=2.14.3",
    "pytest>=9.2.0",
    "dotenv>=0.9.9",
    "aurora-dsql-python-connector>=0.2.7",
    "psycopg2-binary>=2.9.13",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
